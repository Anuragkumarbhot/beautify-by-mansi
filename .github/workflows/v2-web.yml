name: Beautify by Mansi V2 Web CI

on:
  push:
    branches:
      - v2.0.0-foundation
  pull_request:
    branches:
      - main
      - v2.0.0-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run dependency security audit
        run: npm audit --audit-level=high

      - name: Run existing V1 and V2 security tests
        run: npm test

      - name: Type-check V2
        run: npm run typecheck:web

      - name: Lint V2
        run: npm run lint:web

      - name: Build V2
        run: npm run build:web
